<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kathy Health" />
  <meta name="theme-color" content="#1A5F5A" />
  <meta name="description" content="Kathy Health — medications, how you feel, vitals, and care on your iPhone." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="icon" href="./icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Kathy Health</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div id="app" class="app">
    <!-- Welcome / first-run -->
    <section id="view-welcome" class="view welcome-view" hidden>
      <div class="welcome-hero">
        <p class="brand-mark">Kathy Health</p>
        <h1 class="welcome-title">Your day, your care, kept gently in one place.</h1>
        <p class="welcome-lede">Medications, how you feel, numbers, and appointments — private on this iPhone.</p>
        <div class="cta-row">
          <button type="button" class="btn btn-primary" id="btn-start">Start for Kathy</button>
        </div>
      </div>
    </section>

    <!-- Shell -->
    <header class="topbar" id="topbar" hidden>
      <div class="topbar-brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-text">Kathy Health</span>
      </div>
      <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main class="main" id="main" hidden>
      <section id="view-today" class="view panel-view" data-panel="today"></section>
      <section id="view-meds" class="view panel-view" data-panel="meds" hidden></section>
      <section id="view-feel" class="view panel-view" data-panel="feel" hidden></section>
      <section id="view-numbers" class="view panel-view" data-panel="numbers" hidden></section>
      <section id="view-care" class="view panel-view" data-panel="care" hidden></section>
      <section id="view-settings" class="view panel-view" data-panel="settings" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" hidden aria-label="Main">
      <button type="button" class="tab active" data-nav="today">Today</button>
      <button type="button" class="tab" data-nav="meds">Meds</button>
      <button type="button" class="tab" data-nav="feel">Feel</button>
      <button type="button" class="tab" data-nav="numbers">Numbers</button>
      <button type="button" class="tab" data-nav="care">Care</button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close-sheet></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="sheet-title" class="sheet-title"></h2>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>

  <script src="./app.js"></script>
</body>
</html>
