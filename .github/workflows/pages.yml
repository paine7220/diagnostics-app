name: GitHub Pages

on:
  push:
    branches: [main, cursor/atdd-complete-1-2-0-2091]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
