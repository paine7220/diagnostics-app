name: Computer copy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pack-offline-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the offline computer copy
        run: python3 tools/pack-computer-copy.py
      - uses: actions/upload-artifact@v4
        with:
          name: ATDD-computer-copy-1.2.0
          path: dist-computer/ATDD-computer-copy-1.2.0.zip

  windows-installer:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build unsigned Windows installer
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist:win:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ATDD-windows-1.2.0
          path: windows/dist/*.exe
          if-no-files-found: warn
