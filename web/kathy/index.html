<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kathy's Health">
  <meta name="theme-color" content="#0B4F5C">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'self'">
  <title>Kathy’s Health</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="site-header" id="siteHeader" hidden>
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name">Kathy’s Health</p>
          <p class="brand-tag" id="headerDate"></p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="Settings">⚙</button>
    </header>

    <main id="main"></main>

    <nav class="tabbar" id="tabbar" hidden aria-label="Primary">
      <button type="button" data-route="today" class="tab active"><span>Today</span></button>
      <button type="button" data-route="meds"><span>Meds</span></button>
      <button type="button" data-route="log"><span>Log</span></button>
      <button type="button" data-route="care"><span>Care</span></button>
      <button type="button" data-route="notes"><span>Notes</span></button>
    </nav>
  </div>

  <div class="toast" id="toast" hidden role="status"></div>

  <script src="./notes-import.js"></script>
  <script src="./alerts.js"></script>
  <script src="./app.js"></script>
</body>
</html>
